blueprint:
  name: "Elero Cover Tilt v1.0.1"
  description: >
    Tilts a venetian / horizontal blind by briefly reversing the motor.

    Runs close -> wait -> open -> wait -> stop. The motor closes the slats
    to a known end position, then opens for a short time to set the tilt
    angle, then stops. The two delays control the result:

    - Close duration: how long to drive closed before reversing. Long enough
      to reach the fully-closed end stop from any starting position.
    - Open duration: how long to drive open afterwards. This sets the final
      tilt angle (longer = more open slats).

    Works with any cover entity, but built for Elero motors that expose only
    open/close/stop (no native tilt position).

    v1.0.1: Bind inputs to variables so the delay templates resolve
    (fixes "'close_duration' is undefined").
  domain: script
  input:
    cover_entity:
      name: Cover
      description: The venetian blind to tilt.
      selector:
        entity:
          filter:
            - domain: cover
    close_duration:
      name: Close Duration (seconds)
      description: >
        How long to drive the cover closed before reversing. Must be long
        enough to reach the fully-closed end stop from any position.
      default: 2
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box
    open_duration:
      name: Open Duration (seconds)
      description: >
        How long to drive open after closing. Sets the final tilt angle
        (longer = more open slats).
      default: 3
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box

mode: single
max_exceeded: silent
icon: mdi:blinds-horizontal

variables:
  close_duration: !input close_duration
  open_duration: !input open_duration

sequence:
  - action: cover.close_cover
    target:
      entity_id: !input cover_entity
  - delay:
      milliseconds: "{{ (close_duration | float * 1000) | int }}"
  - action: cover.open_cover
    target:
      entity_id: !input cover_entity
  - delay:
      milliseconds: "{{ (open_duration | float * 1000) | int }}"
  - action: cover.stop_cover
    target:
      entity_id: !input cover_entity
