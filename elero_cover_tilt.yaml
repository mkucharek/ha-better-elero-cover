blueprint:
  name: "Elero Cover Tilt v1.1.0"
  description: >
    Tilts a venetian / horizontal blind to a percentage by timing the motor.

    Runs close -> wait -> (open -> wait) -> stop. The motor first drives closed
    for a fixed time to reach a known 0% baseline, then opens for a time
    proportional to the requested tilt percentage, then stops.

    - Close duration: fixed time to drive fully closed (the 0% baseline). Must
      be long enough to reach the closed end stop from any starting position.
    - Open duration: open time that corresponds to 100% tilt. The actual open
      time is open_duration * tilt_pct / 100.
    - Tilt %: runtime parameter (0-100). Passed per call, e.g. from a template
      cover's set_cover_tilt_position. At 0% the blind just closes.

    Open-loop: there is no position feedback, so accuracy depends on consistent
    motor speed and a close_duration that reliably reaches the end stop.

    Built for Elero motors driven through hubs (e.g. Fibaro/Yubii) that expose
    only open/close/stop with no usable tilt.

    v1.1.0: Add percentage tilt via a runtime tilt_pct field; open time scales
    from open_duration (=100%). Drop the wait-for-closed step (hub reports no
    reliable closed state); close_duration is a fixed delay again.
    v1.0.5: Bind cover_entity to a variable so the wait_template resolves.
    v1.0.4: Rename input close_duration -> close_duration_timeout.
    v1.0.3: Default close duration raised to 120s.
    v1.0.2: Wait for the cover to report "closed" before opening.
    v1.0.1: Bind inputs to variables so the delay templates resolve.
  domain: script
  input:
    cover_entity:
      name: Cover
      description: The venetian blind to tilt.
      selector:
        entity:
          filter:
            - domain: cover
    close_duration:
      name: Close Duration (seconds)
      description: >
        Fixed time to drive fully closed before opening (the 0% baseline).
        Long enough to reach the closed end stop from any position.
      default: 2
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box
    open_duration:
      name: Open Duration at 100% (seconds)
      description: >
        Open time corresponding to 100% tilt. Actual open time scales with the
        requested tilt percentage.
      default: 5
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box

mode: single
max_exceeded: silent
icon: mdi:blinds-horizontal

fields:
  tilt_pct:
    name: Tilt %
    description: Target tilt (0 = closed, 100 = open_duration of opening).
    default: 100
    selector:
      number:
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        mode: slider

variables:
  close_duration: !input close_duration
  open_duration: !input open_duration

sequence:
  - action: cover.close_cover
    target:
      entity_id: !input cover_entity
  - delay:
      milliseconds: "{{ (close_duration | float * 1000) | int }}"
  - if:
      - condition: template
        value_template: "{{ (tilt_pct | float(0)) > 0 }}"
    then:
      - action: cover.open_cover
        target:
          entity_id: !input cover_entity
      - delay:
          milliseconds: >
            {{ (open_duration | float * (tilt_pct | float(0)) / 100 * 1000) | int }}
  - action: cover.stop_cover
    target:
      entity_id: !input cover_entity
