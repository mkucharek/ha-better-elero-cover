blueprint:
  name: "Elero Cover Tilt v1.0.3"
  description: >
    Tilts a venetian / horizontal blind by briefly reversing the motor.

    Runs close -> wait-for-closed -> open -> wait -> stop. The motor closes
    the slats to a known end position, then opens for a short time to set the
    tilt angle, then stops.

    - Close duration: max time to reach closed. If the cover reports a real
      "closed" state, the open step starts the instant it's closed; otherwise
      this acts as a fixed drive-closed delay.
    - Open duration: how long to drive open afterwards. This sets the final
      tilt angle (longer = more open slats).

    Works with any cover entity, but built for Elero motors that expose only
    open/close/stop (no native tilt position).

    v1.0.3: Default close duration raised to 120s (it is now a safety timeout
    that should comfortably cover full travel, not a precise drive time).
    v1.0.2: Wait for the cover to report "closed" before opening, with close
    duration as a safety timeout (degrades to a fixed delay if there is no
    position feedback).
    v1.0.1: Bind inputs to variables so the delay templates resolve
    (fixes "'close_duration' is undefined").
  domain: script
  input:
    cover_entity:
      name: Cover
      description: The venetian blind to tilt.
      selector:
        entity:
          filter:
            - domain: cover
    close_duration:
      name: Close Duration (seconds)
      description: >
        Max time to wait for the cover to reach closed before opening. If the
        entity has no real closed feedback, this is a fixed drive-closed delay,
        so make it long enough to reach the end stop from any position.
      default: 120
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: s
          mode: box
    open_duration:
      name: Open Duration (seconds)
      description: >
        How long to drive open after closing. Sets the final tilt angle
        (longer = more open slats).
      default: 3
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box

mode: single
max_exceeded: silent
icon: mdi:blinds-horizontal

variables:
  close_duration: !input close_duration
  open_duration: !input open_duration

sequence:
  - action: cover.close_cover
    target:
      entity_id: !input cover_entity
  # Block until the cover reports closed; fall back to close_duration as a
  # safety timeout for motors with no position feedback.
  - wait_template: "{{ is_state(cover_entity, 'closed') }}"
    timeout: "{{ close_duration | float }}"
    continue_on_timeout: true
  - action: cover.open_cover
    target:
      entity_id: !input cover_entity
  - delay:
      milliseconds: "{{ (open_duration | float * 1000) | int }}"
  - action: cover.stop_cover
    target:
      entity_id: !input cover_entity
